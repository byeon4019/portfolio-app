<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문제 정의부터 해결까지 기술과 사람을 연결하는 기획자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0e;
      --surface: #141416;
      --border: rgba(255,255,255,0.08);
      --accent: #4a7cff;
      --accent2: #a78bfa;
      --text: #f0ede8;
      --muted: #6b6b78;
      --tag-bg: rgba(74,124,255,0.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Serif KR', serif;
      line-height: 1.7;
      overflow-x: hidden;
    }

    /* 배경 그라디언트 */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(ellipse, rgba(74,124,255,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(ellipse, rgba(167,139,250,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── 네비 ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 3rem;
      background: rgba(12,12,14,0.7);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.08em;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }

    /* ── 히어로 ── */
    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8rem 3rem 4rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    .hero-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.6s 0.2s forwards;
    }
    .hero h1 {
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 0.6s 0.35s forwards;
    }
    .hero h1 em {
      font-style: normal;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-tagline {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: var(--muted);
      max-width: 480px;
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp 0.6s 0.5s forwards;
    }
    .hero-contact {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex; gap: 2rem; flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.6s 0.65s forwards;
    }
    .hero-contact span { display: flex; align-items: center; gap: 0.4rem; }

    /* 스크롤 힌트 */
    .scroll-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 3rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.15em;
      display: flex; align-items: center; gap: 0.8rem;
      opacity: 0;
      animation: fadeUp 0.6s 0.9s forwards;
    }
    .scroll-hint::before {
      content: '';
      display: block;
      width: 40px; height: 1px;
      background: var(--muted);
    }

    /* ── 섹션 공통 ── */
    section {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 6rem 3rem;
    }
    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: var(--accent);
      margin-bottom: 1rem;
    }
    .section-title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 900;
      margin-bottom: 3rem;
      letter-spacing: -0.02em;
    }
    hr.divider {
      border: none;
      border-top: 1px solid var(--border);
      max-width: 1100px;
      margin: 0 3rem;
    }

    /* ── API 상태 배너 ── */
    #api-status {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto 0;
      padding: 0 3rem;
    }
    .api-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(74,124,255,0.1);
      border: 1px solid rgba(74,124,255,0.25);
      border-radius: 4px;
      padding: 0.4rem 0.9rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent);
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    /* ── 프로젝트 카드 ── */
    .projects-grid { display: grid; gap: 1.5rem; }
    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem 2.5rem;
      transition: border-color 0.25s, transform 0.25s;
      cursor: default;
    }
    .project-card:hover {
      border-color: rgba(74,124,255,0.3);
      transform: translateY(-2px);
    }
    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .project-title { font-size: 1.15rem; font-weight: 600; }
    .project-role {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent2);
      background: rgba(167,139,250,0.1);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: 4px;
      padding: 0.25rem 0.65rem;
      white-space: nowrap;
    }
    .project-desc { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.2rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.2rem; }
    .tag {
      background: var(--tag-bg);
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      padding: 0.2rem 0.6rem;
      border-radius: 3px;
      letter-spacing: 0.05em;
    }
    .results { list-style: none; }
    .results li {
      font-size: 0.85rem;
      color: var(--text);
      padding: 0.3rem 0;
      padding-left: 1.2rem;
      position: relative;
      opacity: 0.85;
    }
    .results li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--accent);
    }

    /* ── 스킬 ── */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.2rem;
    }
    .skill-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      transition: border-color 0.25s;
    }
    .skill-card:hover { border-color: rgba(74,124,255,0.3); }
    .skill-category {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-bottom: 0.8rem;
    }
    .skill-items { display: flex; flex-direction: column; gap: 0.4rem; }
    .skill-item {
      font-size: 0.85rem;
      color: var(--muted);
      padding-left: 0.8rem;
      position: relative;
    }
    .skill-item::before {
      content: '·';
      position: absolute;
      left: 0;
      color: var(--accent2);
    }

    /* ── 로딩 스피너 ── */
    .loading {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* ── 푸터 ── */
    footer {
      position: relative; z-index: 1;
      border-top: 1px solid var(--border);
      padding: 2rem 3rem;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }
    footer p {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* ── 애니메이션 ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* 스크롤 진입 애니메이션 */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<nav>
  <span class="nav-logo">BYEON · PORTFOLIO</span>
  <div class="nav-links">
    <a href="#projects">프로젝트</a>
    <a href="#skills">역량</a>
  </div>
</nav>

<!-- 히어로 -->
<div class="hero">
  <div class="hero-label">SERVICE PLANNER</div>
  <h1>문제 정의부터<br>해결까지,<br><em>기술과 사람을</em><br>연결합니다.</h1>
  <p class="hero-tagline">서비스를 만드는 사람이 아니라, 계속 쓰이게 만드는 기획자로 성장합니다.</p>
  <div class="hero-contact" id="hero-contact">
    <span>📧 byeon4019@naver.com</span>
    <span>📱 +82 10 6238 8448</span>
  </div>
  <div class="scroll-hint">SCROLL</div>
</div>

<!-- API 상태 -->
<div id="api-status">
  <div class="api-badge">
    <span class="dot"></span>
    <span id="api-status-text">API 연결 확인 중...</span>
  </div>
</div>

<hr class="divider" style="margin-top:3rem">

<!-- 프로젝트 -->
<section id="projects">
  <div class="section-label reveal">PROJECTS</div>
  <div class="section-title reveal">담당 프로젝트</div>
  <div class="projects-grid" id="projects-grid">
    <div class="loading"><div class="spinner"></div> API에서 프로젝트 불러오는 중...</div>
  </div>
</section>

<hr class="divider">

<!-- 스킬 -->
<section id="skills">
  <div class="section-label reveal">SKILLS</div>
  <div class="section-title reveal">역량</div>
  <div class="skills-grid" id="skills-grid">
    <div class="loading"><div class="spinner"></div> API에서 역량 불러오는 중...</div>
  </div>
</section>

<footer>
  <p>© byeon · Service Planner</p>
  <p id="footer-api">Powered by Flask REST API</p>
</footer>

<script>
  // API 호출 함수
  async function fetchAPI(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error('API 오류');
    return res.json();
  }

  // API 상태 확인
  async function initAPIStatus() {
    try {
      const data = await fetchAPI('/api/health');
      document.getElementById('api-status-text').textContent = data.message;
    } catch {
      document.getElementById('api-status-text').textContent = 'API 서버 연결 실패';
      document.querySelector('.dot').style.background = '#ef4444';
    }
  }

  // 프로젝트 렌더링
  async function loadProjects() {
    const grid = document.getElementById('projects-grid');
    try {
      const projects = await fetchAPI('/api/projects');
      grid.innerHTML = projects.map(p => `
        <div class="project-card reveal">
          <div class="project-header">
            <div class="project-title">${p.title}</div>
            <div class="project-role">${p.role}</div>
          </div>
          <p class="project-desc">${p.description}</p>
          <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
          <ul class="results">${p.results.map(r => `<li>${r}</li>`).join('')}</ul>
        </div>
      `).join('');
      observeReveal();
    } catch {
      grid.innerHTML = '<p style="color:var(--muted)">프로젝트를 불러오지 못했습니다.</p>';
    }
  }

  // 스킬 렌더링
  async function loadSkills() {
    const grid = document.getElementById('skills-grid');
    try {
      const skills = await fetchAPI('/api/skills');
      grid.innerHTML = skills.map(s => `
        <div class="skill-card reveal">
          <div class="skill-category">${s.category}</div>
          <div class="skill-items">${s.items.map(i => `<div class="skill-item">${i}</div>`).join('')}</div>
        </div>
      `).join('');
      observeReveal();
    } catch {
      grid.innerHTML = '<p style="color:var(--muted)">역량 정보를 불러오지 못했습니다.</p>';
    }
  }

  // 스크롤 애니메이션
  function observeReveal() {
    const io = new IntersectionObserver(entries => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          setTimeout(() => e.target.classList.add('visible'), i * 80);
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.reveal:not(.visible)').forEach(el => io.observe(el));
  }

  // 초기화
  initAPIStatus();
  loadProjects();
  loadSkills();
  observeReveal();
</script>
</body>
</html>
